name: 刷步数

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install requests

      - name: 执行
        env:
          MIMOTION_PMODE: ${{ secrets.PMODE }}
          MIMOTION_PKEY: ${{ secrets.PKEY }}
          MIMOTION_USER: ${{ secrets.USER }}
          MIMOTION_PWD: ${{ secrets.PWD }}
          MIMOTION_STEP: ${{ secrets.STEP }}
        run: |
          python main.py "$MIMOTION_PMODE" "$MIMOTION_PKEY" "$MIMOTION_USER" "$MIMOTION_PWD" "$MIMOTION_STEP"
